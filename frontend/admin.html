<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>관제 — 실내 대피 안내</title>
  <link rel="stylesheet" href="css/style.css" />
  <style>
    /* ─────────────────────────────────────────────────────────────
       관제 — 지도가 화면 전체이고, 나머지는 그 위에 떠 있다.

       예전에는 카드 두 칸이었다. 지도가 왼쪽 칸의 한 카드였으니 도면이
       화면의 3분의 1도 못 썼고, 관제하는 사람이 정작 봐야 하는 것이 제일
       작았다. 관제는 읽는 화면이 아니라 **보는 화면**이다.

       밝은 제도판 톤을 쓴다. 폰 앱은 어둡지만, 그건 연기 속에서 눈부심을
       줄이려는 것이고 관제는 밝은 사무실의 큰 모니터다. 목적이 다르면
       색도 다른 게 맞다. 도면 위의 선을 읽는 데는 흰 바탕이 낫다.
       ───────────────────────────────────────────────────────────── */
    .adm {
      /* 중립색은 강조색 쪽으로 살짝 차갑게 기울였다 — 순회색은 안 고른 티가 난다 */
      /* 어두운 관제실. 조명을 낮추고 화면만 보는 곳이고, 무엇보다
         **불을 빨강 하나로 몰아 쓰려면 배경이 어두워야** 한다. 밝은 판에서는
         빨강이 다른 색들과 같은 무게로 보인다. */
      --ground:      #15181c;
      --surface:     #1e2228;
      --surface-2:   #262b33;
      --line:        #2e343d;
      --line-2:      #3c444f;
      --ink:         #eef2f7;
      --muted:       #93a1b2;
      --faint:       #64717f;

      /* 색을 넷으로 줄인다.
         호박색을 강조로 쓰다 보니 초록·빨강과 함께 넷이 경쟁했고, 화면이
         알록달록해졌다. **색이 적으면 저절로 정돈된다.**

           파랑   시스템이 추적하는 것 (경로·위치·강조)
           초록   출구·정상
           빨강   화재  — 이 색은 불에만 쓴다
           주황   주의  — 얇은 답사처럼 «봐야 하지만 위험은 아닌» 것에만
           민트   출구·안전
           파랑   경로·현재 위치
           보라   비콘·답사 지점 — 출구(민트)와 갈리게 따로 뺐다 */
      --accent:      #4d9fff;
      --accent-soft: rgba(77,159,255,.14);
      --route:       #4d9fff;
      --mint:        #2fd6a6;
      --mint-soft:   rgba(47,214,166,.14);
      --danger:      #ff4438;
      --warn:        #e79a3c;
      --ok:          #2fd6a6;
      /* 비콘은 **보라**다. 예전에는 --ok 와 같은 민트였는데, 출구도 민트라서
         지도에서 «저 초록 점이 출구인가 비콘인가» 가 안 갈렸다. 색이 뜻을
         하나씩만 맡아야 흘깃 봐도 읽힌다. */
      --beacon:      #b06bff;
      --beacon-soft: rgba(176,107,255,.14);

      /* 층을 이루는 색 — 바닥판·벽면·벽 윗면 */
      --slab:        #33383f;
      --wall-top:    #d5dbe2;
      --wall-side:   #8b939d;

      /* minimap.js 가 이 이름들을 var() 로 읽는다. 밝은 판에 맞춰 다시 준다. */
      --map-bg:      transparent;
      --corridor:    #6b7480;
      --node:        #97a2ae;
      --map-text:    #b9c4d0;

      /* 참조 화면처럼 그림자를 넓고 옅게 — 카드가 «떠 있다»보다
         «놓여 있다»에 가깝게 보인다. 관제는 오래 보는 화면이라
         대비가 셀수록 눈이 빨리 피로해진다. */
      --shadow: 0 2px 8px rgba(0,0,0,.4), 0 18px 44px rgba(0,0,0,.32);
      --radius: 14px;

      background: radial-gradient(120% 90% at 50% 20%, #1b1f25 0%, #12151a 70%);
      color: var(--ink);
      font-size: 13px;
      line-height: 1.45;
      height: 100vh;
      overflow: hidden;
      font-feature-settings: 'tnum' 1;
    }
    .adm button, .adm input, .adm select { font: inherit; color: inherit; }
    .adm :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }

    /* 대문자 라벨 — 값이 아니라 값의 이름이라는 표시 */
    .adm .lbl {
      font-size: 10px; font-weight: 600; letter-spacing: .09em;
      text-transform: uppercase; color: var(--faint);
    }

    /* ── 셸 ─────────────────────────────────────────────── */
    .ops { display: grid; grid-template-rows: 52px 1fr; height: 100vh; }

    .ops-bar {
      display: grid; grid-template-columns: 1fr auto 1fr; align-items: center;
      gap: 16px; padding: 0 14px;
      background: var(--surface); border-bottom: 1px solid var(--line);
    }
    .ops-brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
    .ops-mark { width: 20px; height: 20px; flex: none; color: var(--accent); }
    .ops-name { font-size: 13.5px; font-weight: 650; letter-spacing: .01em; }
    .ops-where {
      color: var(--muted); font-size: 12px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      padding-left: 10px; margin-left: 4px; border-left: 1px solid var(--line);
    }

    .ops-search { position: relative; width: min(38vw, 380px); }
    .ops-search input {
      width: 100%; height: 30px; padding: 0 10px 0 30px;
      background: var(--surface-2); border: 1px solid transparent;
      border-radius: 8px; font-size: 12.5px;
    }
    .ops-search input::placeholder { color: var(--faint); }
    .ops-search input:focus { background: var(--surface); border-color: var(--line-2); outline: none; }
    .ops-search svg { position: absolute; left: 9px; top: 8px; color: var(--faint); }

    .ops-actions { display: flex; align-items: center; gap: 8px; justify-content: flex-end; }

    .ctx {
      display: flex; align-items: center; gap: 7px; height: 30px; padding: 0 10px;
      background: var(--surface); border: 1px solid var(--line); border-radius: 8px;
      font-size: 12.5px; color: var(--muted);
    }
    .ctx b { color: var(--ink); font-weight: 600; }
    .ctx .chip {
      width: 17px; height: 17px; border-radius: 5px; display: grid; place-items: center;
      background: var(--accent-soft); color: var(--accent); font-size: 10px; font-weight: 700;
    }

    /* 버튼은 한 모양으로 통일한다.
       밑줄 링크 하나와 파랗게 채운 버튼 하나가 나란히 있으니 계급이 셋
       (링크·테두리·채움)으로 보여 산만했다. 누를 수 있는 것은 다 같은 옷을 입고,
       무엇이 중요한지는 **자리**로 말한다. */
    .btn {
      height: 29px; padding: 0 12px; border-radius: 8px; cursor: pointer;
      border: 1px solid var(--line); background: transparent; color: var(--muted);
      font-size: 12.5px; font-weight: 550; display: inline-flex; align-items: center; gap: 6px;
      text-decoration: none; white-space: nowrap;
    }
    .adm a.btn, .adm a.btn:visited, .adm a.btn:hover { text-decoration: none; }
    .btn:hover { background: var(--surface); border-color: var(--line-2); color: var(--ink); }
    .btn.primary { background: var(--accent); border-color: var(--accent); color: #04121f; font-weight: 650; }
    .btn.primary:hover { filter: brightness(1.08); }
    .btn.icon { width: 30px; padding: 0; justify-content: center; }

    .pill {
      display: inline-flex; align-items: center; gap: 5px;
      height: 21px; padding: 0 8px; border-radius: 999px;
      background: var(--surface-2); border: 1px solid var(--line);
      font-size: 11px; color: var(--muted); white-space: nowrap;
    }
    .pill i { width: 6px; height: 6px; border-radius: 50%; background: currentColor; flex: none; }
    .pill.on   { color: var(--ok); }
    .pill.warn { color: var(--warn); }
    .pill.bad  { color: var(--danger); background: rgba(255,68,56,.12); border-color: rgba(255,68,56,.4); }
    .pill.accent { color: var(--accent); background: var(--accent-soft); border-color: #d8e3ff; }

    /* ── 본문: 지도가 바닥이고 전부 그 위에 뜬다 ─────────────── */
    /* 왼쪽은 층, 오른쪽은 지금 벌어지는 일.
   둘이 서로 다른 질문에 답한다 — 지도는 «어디», 패널은 «무엇을 할까».
   예전에는 패널이 지도 위에 떠 있어서 도면 오른쪽을 늘 가렸고, 사람을
   고를 때마다 지도가 줄었다 늘었다 했다. 칸으로 나누면 둘 다 안 흔들린다. */
    .ops-body {
      display: grid; grid-template-columns: minmax(0, 1fr) 336px;
      overflow: hidden; background: transparent;
    }
    .ops-stage-col { position: relative; overflow: hidden; }

    /* 떠 있는 조각들이 도면을 가리지 않게 그만큼 안쪽 여백을 준다.
       왼쪽은 도구·목록(232px), 오른쪽은 레일(36px). 상세 패널이 열리면
       그 폭만큼 더 민다 — 안 그러면 도면 오른쪽이 패널 밑으로 들어가
       보이지 않는다. */
    /* 오른쪽 여백은 **패널이 비어 있을 때도** 잡아 둔다.
       패널은 늘 화면에 있고(빈 상태 안내를 띄운다), 여백을 선택했을 때만
       주면 도면이 평소에 패널 밑으로 들어가 오른쪽이 잘려 보인다. 사람을
       고를 때마다 지도가 작아졌다 커졌다 하는 것도 관제에서는 성가시다. */
    .ops-canvas {
      position: absolute; inset: 0; overflow: hidden;
      /* 카드는 지도 **위에** 얹는다. 자리를 비워 두면 도면이 그만큼 작아지는데,
         관제에서 제일 커야 하는 것이 도면이다. 판은 가운데에 있고 카드는
         네 귀퉁이에 있어 실제로 겹치는 부분은 거의 없다. */
      padding: 16px;
      /* grid + place-content:center 는 항목을 min-content 로 접어서 지도가
         손톱만 해진다. flex 로 가운데에 두고 폭은 컨테이너 기준으로 잡는다. */
      display: flex; align-items: center; justify-content: center;
    }

    /* 격자 — 도면이 아직 없을 때 빈 화면이 "고장"으로 보이지 않게 한다 */
    .ops-canvas::before {
      content: ''; position: absolute; inset: 0; pointer-events: none;
      background-image: linear-gradient(rgba(255,255,255,.03) 1px, transparent 1px),
                        linear-gradient(90deg, rgba(255,255,255,.03) 1px, transparent 1px);
      background-size: 32px 32px; opacity: .35;
    }
    /* ── 기울인 층 ──────────────────────────────────────────
       도면을 눕혀 놓으면 «건물의 한 층» 으로 읽힌다. 정면으로 보는 평면도는
       도면이지만, 기울여서 밑에 두께를 깔면 그 위에 사람이 서 있는 공간이
       된다 — 관제하는 사람이 봐야 하는 것이 바로 그것이다.
       (정밀하게 찍어야 할 때가 있으므로 평면으로 되돌리는 토글을 둔다.) */
        .stage {
      perspective: 2600px; perspective-origin: 50% 46%; width: 100%;
      cursor: grab; touch-action: none;
    }
    .stage.dragging { cursor: grabbing; }
    /* 끄는 동안에는 전환을 끈다 — 안 그러면 손을 따라오지 않고 뒤늦게 움직인다 */
    .stage.dragging .stage-inner { transition: none; }
    .stage-inner {
      /* 기본 각도를 **변수로** 못박아 둔다. transform 안의 fallback
         (`var(--tilt, 46deg)`) 만 두면 변수 자체는 정의되지 않은 상태라,
         드래그가 그 값을 읽을 때 0 이 나와 판이 순간 납작해진다. */
      --tilt: 46deg;
      /* 도면 자체가 쐐기 모양이라 여기에 회전을 더 얹으면 «비뚤어졌다» 로 읽힌다.
         기본은 정면. 돌려 보고 싶으면 Shift+끌기로 언제든 돌릴 수 있다. */
      --spin: 0deg;
      transform-style: preserve-3d;
      /* 화면 맞춤(--fit)과 사람이 정한 확대(--zoom)를 **곱한다.**
         예전에는 확대를 폭으로 줬는데(width: 100%*zoom), 그러면 판이 커진
         만큼 맞춤이 다시 깎아서 정확히 상쇄됐다 — 휠을 굴려도 크기가 그대로였다.
         맞춤은 «1배일 때 화면에 들어가는 배율» 이고, 확대는 그 위에 얹는 값이다. */
      transform: scale(calc(var(--fit, 1) * var(--zoom, 1)))
                 rotateX(var(--tilt, 46deg)) rotateZ(var(--spin, 0deg));
      margin: 0 auto; width: 100%;
    }
    /* 전환은 버튼으로 바꿀 때만 — 끌 때는 손을 그대로 따라와야 한다 */
    .stage-inner.animate { transition: transform .45s cubic-bezier(.2,.7,.3,1); }
    .ops-body[data-view="flat"] .stage-inner { --tilt: 0deg !important; --spin: 0deg !important; }
    .ops-body[data-view="flat"] .slab { opacity: 0; }

    /* ── 세워진 벽 ────────────────────────────────────────
       도면 사진에서 뽑은 직선(`scripts/extract-walls.py`)을 하나씩 **세운다.**
       기울인 사진만으로는 «기울인 종이» 로 보이는데, 벽이 서면 그제서야
       «건물의 한 층» 이 된다.

       각 벽은 밑변을 축으로 90도 일으켜 세운 판이다. 위에서 아래로 밝기를
       주어 빛이 위에서 온다는 것을 알린다 — 단색이면 입체가 아니라 종이
       조각들로 보인다. */
    .walls {
      position: absolute; left: 0; top: 0; transform-origin: 0 0;
      transform-style: preserve-3d; pointer-events: none;
      transition: opacity .3s ease;
    }
    .walls i {
      position: absolute; left: 0; top: 0; display: block;
      width: var(--len); height: var(--wh, 26px);
      transform-origin: 0 100%;
      /* rotateX 의 **부호**가 벽의 위아래를 정한다.
         +90도는 국소 −Y(위로 뻗은 몸통)를 −Z 로 보내 벽을 바닥 아래로
         내려버린다 — 지도에 가려 한 장도 안 보인다. −90도라야 +Z, 즉
         바닥 위로 선다. */
      transform: translate3d(var(--x), calc(var(--y) - var(--wh, 26px)), 0)
                 rotateZ(var(--a)) rotateX(-90deg);
      /* 도면(반전한 흰 종이) 위에 서는 벽이라 **바닥보다 어두워야** 보인다.
         처음에 흰색으로 뒀더니 흰 종이에 묻혀 124장이 통째로 사라졌다.
         위를 밝게, 아래로 갈수록 어둡게 — 빛이 위에서 온다는 신호다. */
      background: linear-gradient(180deg, var(--wall-top) 0%, var(--wall-side) 70%, #6f767f 100%);
      border-top: 1.5px solid #f2f5f8;
      box-shadow: 0 0 0 .5px rgba(0,0,0,.35);
    }
    /* 방 안쪽 칸막이 — 낮고 어둡게. 다 남아 있지만 물러나 있다. */
    .walls i.inner {
      height: calc(var(--wh, 26px) * .55);
      transform: translate3d(var(--x), calc(var(--y) - var(--wh, 26px) * .55), 0)
                 rotateZ(var(--a)) rotateX(-90deg);
      background: linear-gradient(180deg, #9aa3ad 0%, #6d757e 70%, #565d65 100%);
      border-top-color: #b6bec7;
    }

    /* 불에 닿은 벽 */
    .walls i.hot {
      background: linear-gradient(180deg, #ffb0a4 0%, #e8574a 65%, #b32a20 100%);
      border-top-color: #ffd9d3;
      box-shadow: 0 0 12px rgba(255,68,56,.6);
    }
    .ops-body[data-view="flat"] .walls { opacity: 0; }

    /* ── 비상구 표지판 ────────────────────────────────────
       화재존과 비상구가 둘 다 «색칠한 영역» 이면 구분이 안 된다. 종류를
       다르게 만든다 — 화재는 **면**(빛나는 구역), 비상구는 **물체**(서 있는
       표지판). 색이 아니라 형태가 다르면 흘깃 봐도 갈린다.

       실제 건물의 비상구 표지판을 그대로 흉내 낸다: 초록 판에 흰 픽토그램.
       관제하는 사람이 도면에서 처음 보는 기호가 아니라 **매일 천장에서 보던
       그 표지판**이라야 설명 없이 읽힌다. */
    .signs {
      position: absolute; left: 0; top: 0; transform-origin: 0 0;
      transform-style: preserve-3d; pointer-events: none;
    }
    .signs b {
      position: absolute; left: 0; top: 0; display: grid; place-items: center;
      width: var(--size, var(--sw)); height: var(--size, var(--sh));
      transform-origin: 50% 100%;
      transform: translate3d(calc(var(--x) - var(--size, var(--sw)) / 2), calc(var(--y) - var(--size, var(--sh))), 0)
                 rotateX(-90deg);
      background: #00b879;
      border: 1px solid #73f0c7; border-radius: 3px;
      box-shadow: 0 0 10px rgba(47,214,166,.75), 0 0 26px rgba(47,214,166,.35);
    }
    .signs b.target {
      border-width: 2px;
      box-shadow: 0 0 14px rgba(47,214,166,1), 0 0 34px rgba(47,214,166,.7);
    }
    /* 표지판을 늘 정면으로 세운다 — 판을 돌려도 글자가 뒤집히지 않게
       회전 반대 방향으로 되돌린다(빌보드). */
    .signs b svg {
      width: 100%; height: 100%; display: block;
      transform: rotateZ(calc(var(--spin, 0deg) * -1));
    }
    .ops-body[data-view="flat"] .signs { opacity: 0; }
    .signs { transition: opacity .3s ease; }

    .map-stack {
      position: relative;
      background: var(--slab); border: 1px solid var(--line-2);
      border-radius: var(--radius); overflow: hidden;
      box-shadow: 0 1px 2px rgba(22,35,47,.05);
    }

    /* 층의 두께. 같은 판을 아래로 여러 겹 깔아 옆면을 흉내 낸다 —
       진짜 벽을 세우려면 방 폴리곤이 필요한데 우리에겐 점과 선뿐이다. */
    /* 두께는 같은 판을 Z 로 조금씩 내려 겹쳐서 만든다. 한 장만 깔면 «그림자»
       로 보이고, 여러 장을 겹쳐야 «옆면» 으로 읽힌다. 아래로 갈수록 어둡게
       해서 빛이 위에서 온다는 것을 알린다. */
    .slab {
      position: absolute; inset: 0; transform-style: preserve-3d;
      transition: opacity .45s ease; pointer-events: none;
    }
    .slab i {
      position: absolute; inset: 0; border-radius: var(--radius);
      background: var(--c); display: block;
      transform: translateZ(calc(var(--d) * -3px));
    }
    /* 바닥에 드리우는 그림자 — 이게 없으면 «떠 있다»가 아니라 «떠 다닌다» */
    .stage-shadow {
      position: absolute; left: 18%; right: 18%; top: 58%; height: 30%;
      background: radial-gradient(ellipse at center, rgba(0,0,0,.7), transparent 70%);
      filter: blur(26px); pointer-events: none; z-index: 0;
      transition: opacity .45s ease;
    }
    .ops-body[data-view="flat"] .stage-shadow { opacity: 0; }
    .map-stack svg { display: block; width: 100%; height: auto; }

    /* 도면 사진은 **검은 바탕에 흰 선**이다(비상대피도가 대개 그렇다).
       흰 판에 그대로 깔면 검은 덩어리가 되고, 옅게 깔면 회색 죽이 된다.
       그래서 명도를 뒤집어 «흰 종이에 검은 선» 으로 바꿔 쓴다.
       hue-rotate 를 같이 거는 건 invert 만 하면 초록 대피화살표가 자홍색이,
       빨간 소화기 표시가 청록색이 되기 때문이다 — 180° 돌려 색을 되돌린다. */
    /* 정리본은 «투명 배경 + 짙은 선» 이다. 어두운 바닥판에서는 짙은 선이
       묻히므로 명도를 뒤집어 **밝은 선**으로 쓴다. 원본 사진(raw)은 이미
       흰 선이라 그대로 두면 된다. */
    .ops-body[data-floor="clean"] .map-stack #admin-map image {
      filter: invert(1);
      opacity: .5;
    }
    .ops-body[data-floor="raw"] .map-stack #admin-map image { opacity: .55; }
    .map-stack #corridor-layer, .map-stack #room-layer, .map-stack #route-layer,
    .map-stack #photo-scenario-layer,
    .map-stack #beacon-waves, .map-stack #live-layer, .map-stack #pick-layer {
      position: absolute; inset: 0; pointer-events: none;
    }
    /* 사람 선택용 레이어는 **원 위에서만** 클릭을 받는다.
       SVG 전체에 pointer-events:auto 를 주면 그 판이 지도를 통째로 덮어서,
       통로를 클릭해도 이 레이어가 먼저 먹는다 — 화재를 넣을 수가 없었다. */
    .map-stack #pick-layer { pointer-events: none; }
    .map-stack #pick-layer circle { pointer-events: auto; }
    .map-stack #pick-layer circle { cursor: pointer; }

    /* 떠 있는 것들의 공통 생김새 */
    .float {
      position: absolute; z-index: 3;
      background: rgba(30,34,40,.9); backdrop-filter: blur(10px);
      border: 1px solid var(--line); border-radius: var(--radius);
      box-shadow: 0 2px 8px rgba(0,0,0,.4), 0 18px 44px rgba(0,0,0,.35);
    }

    /* ── 도구 팔레트 (왼쪽 위) ─────────────────────────────── */
    /* ── 지도 위 조작 도구 ────────────────────────────────
       도구판과 레일이 서로 다른 치수를 쓰고 있었다 — 레일 버튼은 크고 둥글고,
       도구 버튼은 작고 각지고, 여백도 달랐다. 나란히 붙어 있는 두 판이라
       그 차이가 «대충 붙인 것» 으로 보인다.

       하나의 자로 맞춘다:  버튼 30px · 모서리 8px · 안여백 10px · 사이 5px */
    /* 레일(오른쪽 16 + 폭 50) 옆에 10px 띄운다 */
    .ops-tools { top: 16px; right: 76px; width: 232px; padding: 10px; }
    .ops-tools > .lbl { display: block; margin-bottom: 9px; }
    .toolgrid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 5px; }
    .tool {
      height: 30px; border-radius: 8px; cursor: pointer; font-size: 11.5px; font-weight: 550;
      border: 1px solid var(--line); background: var(--surface-2); color: var(--muted);
      padding: 0; display: grid; place-items: center;
    }
    .tool:hover { border-color: var(--line-2); color: var(--ink); }
    .tool[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #04121f; }
    .tool.ghost {
      grid-column: 1 / -1; margin-top: 4px; background: var(--surface); color: var(--muted);
    }
    .tool.ghost:hover { color: var(--danger); border-color: rgba(255,68,56,.4); }
    .tool.preset {
      grid-column: 1 / -1; margin-top: 4px;
      background: var(--accent-soft); border-color: rgba(77,159,255,.38); color: #b9d9ff;
    }
    .tool.preset:hover { border-color: var(--accent); color: #e7f2ff; }
    .tool.preset[aria-pressed="true"] {
      background: var(--accent); border-color: var(--accent); color: #04121f;
    }
    .tool:disabled { cursor: wait; opacity: .62; }

    .radius-box { margin-top: 9px; padding-top: 9px; border-top: 1px solid var(--line); }
    .radius-box label { display: flex; justify-content: space-between; font-size: 11.5px; color: var(--muted); }
    .radius-box input[type=range] { width: 100%; margin: 7px 0 2px; accent-color: var(--accent); }
    .hint { color: var(--faint); font-size: 11px; line-height: 1.4; }
    .hint + .hint { margin-top: 5px; }

    /* ── 감시 목록 서랍 (왼쪽 아래) ───────────────────────── */
    .ops-drawer {
      border-top: 1px solid var(--line); background: var(--surface);
      display: flex; flex-direction: column; max-height: 30vh;
      box-shadow: none; border-radius: 0;
    }
    .ops-drawer[data-open="false"] .drawer-body { display: none; }
    .drawer-tabs {
      display: grid; grid-template-columns: repeat(4, 1fr);
      border-bottom: 1px solid var(--line);
    }
    .drawer-tabs button {
      border: 0; background: none; cursor: pointer; padding: 8px 2px 7px;
      font-size: 11px; color: var(--muted); border-bottom: 2px solid transparent;
      display: grid; gap: 1px; justify-items: center;
    }
    .drawer-tabs button b { font-size: 13px; font-weight: 650; color: var(--ink); }
    .drawer-tabs button[aria-selected="true"] { color: var(--accent); border-bottom-color: var(--accent); }
    .drawer-tabs button[aria-selected="true"] b { color: var(--accent); }
    .drawer-body { overflow: auto; padding: 4px; }
    .drawer-pane[hidden] { display: none; }

    .list { list-style: none; display: grid; gap: 2px; }
    /* 센서·구조·재탐색 목록은 두 줄짜리(본문 + 시각)라 블록으로 두고,
       사람 목록만 한 줄 안에서 이름과 상태를 양끝으로 민다. */
    .list li { padding: 7px 8px; border-radius: 7px; font-size: 12px; color: var(--ink); }
    .list li strong { font-weight: 650; }
    .list .time { font-size: 10.5px; color: var(--faint); margin-top: 2px; }
    .list li.empty { color: var(--faint); padding: 10px 8px; }
    .list li[data-user] {
      display: flex; align-items: baseline; gap: 7px; cursor: pointer;
    }
    .list li[data-user] .who { font-weight: 550; }
    .list li[data-user] .sub { color: var(--faint); font-size: 11px; margin-left: auto; }
    .list li[data-user]:hover { background: var(--surface-2); }
    .list li[data-user][aria-current="true"] { background: var(--accent-soft); color: var(--accent); }
    .list li[data-user][aria-current="true"] .sub { color: var(--accent); }
    .sos-item { font-weight: 650; color: var(--danger); }
    .guardian-line { font-size: 11px; color: var(--muted); margin-top: 3px; }
    .guardian-line a { color: var(--accent); }

    /* ── 상세 패널 (오른쪽) ───────────────────────────────── */
    .ops-side {
      background: var(--surface); border-left: 1px solid var(--line);
      display: grid; grid-template-rows: minmax(0, 1fr) auto; overflow: hidden;
    }
    .ops-panel { overflow: auto; background: var(--surface); }
    .panel-head { padding: 12px 12px 10px; border-bottom: 1px solid var(--line); }
    .panel-title { display: flex; align-items: center; gap: 8px; }
    .panel-title h2 { font-size: 14px; font-weight: 650; letter-spacing: -.01em; margin: 0; }
    .panel-title .close {
      margin-left: auto; width: 24px; height: 24px; border-radius: 50%;
      border: 0; background: var(--surface-2); color: var(--muted); cursor: pointer;
    }
    .panel-title .close:hover { background: #ebedf1; color: var(--ink); }
    .panel-pills { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 8px; }
    .panel-body { overflow: auto; padding: 12px; display: grid; gap: 12px; }

    .acts { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
    .acts button {
      display: grid; gap: 5px; justify-items: center; cursor: pointer;
      border: 0; background: none; font-size: 10.5px; color: var(--muted);
    }
    .acts button span {
      width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center;
      border: 1px solid var(--line); background: var(--surface); color: var(--ink); font-size: 14px;
    }
    .acts button:hover span { border-color: var(--line-2); background: var(--surface-2); }
    .acts button.solid span { background: var(--accent); border-color: var(--accent); color: #04121f; }

    .triplet {
      display: grid; grid-template-columns: repeat(3, 1fr); gap: 1px;
      background: var(--line); border: 1px solid var(--line); border-radius: 9px; overflow: hidden;
    }
    .triplet div { background: var(--surface); padding: 8px 9px; }
    .triplet b { display: block; font-size: 13px; font-weight: 650; }
    .triplet span { font-size: 10.5px; color: var(--faint); }

    .sub-card { border: 1px solid var(--line); border-radius: 9px; overflow: hidden; }
    .sub-card > header {
      display: flex; align-items: center; gap: 7px; padding: 8px 10px;
      background: var(--surface-2); border-bottom: 1px solid var(--line); font-size: 12px; font-weight: 550;
    }
    .kv { display: grid; gap: 0; }
    .kv > div {
      display: flex; justify-content: space-between; gap: 10px;
      padding: 7px 10px; font-size: 12px; border-top: 1px solid var(--line);
    }
    .kv > div:first-child { border-top: 0; }
    .kv dt, .kv .k { color: var(--muted); }
    .kv dd, .kv .v { margin: 0; font-weight: 550; text-align: right; }

    /* 경로 진행 막대 — 숫자만으로는 "얼마나 왔나"가 안 읽힌다 */
    .route-card { border: 1px solid var(--line); border-radius: 9px; padding: 10px; }
    .route-ends { display: flex; justify-content: space-between; font-size: 11.5px; gap: 8px; }
    .route-ends b { font-weight: 600; }
    .route-bar {
      position: relative; height: 3px; margin: 9px 0 7px;
      background: var(--line); border-radius: 2px;
    }
    .route-bar i { position: absolute; inset: 0 auto 0 0; background: var(--accent); border-radius: 2px; }
    .route-bar u {
      position: absolute; top: 50%; width: 9px; height: 9px; border-radius: 50%;
      background: var(--surface-2); border: 2px solid var(--accent); transform: translate(-50%, -50%);
    }

    .panel-empty { padding: 34px 20px; text-align: center; color: var(--faint); display: grid; gap: 8px; }
    /* `hidden` 은 UA 의 display:none 인데, 위의 display:grid / display:contents 가
       더 구체적이라 이겨 버린다. 숨김이 안 먹으면 빈 안내와 상세가 겹쳐 뜬다. */
    .ops-panel > [hidden] { display: none !important; }
    .panel-empty .big { font-size: 22px; opacity: .5; }

    /* ── 상황 요약 — 사람을 고르기 전에 관제가 알아야 하는 것 ──────
       관제는 대부분의 시간을 «아무도 안 고른 상태» 로 보낸다. 그때 오른쪽 칸이
       비어 있으면 볼 이유가 없는 화면이 된다. 급한 순서로 채운다. */
    /* ── 오른쪽 패널 ──────────────────────────────────────
       큰 숫자 하나에 작은 칩을 붙이고, 구성비는 띠로, 추이는 면적으로.
       상자를 여러 개 쌓는 대신 **한 카드 안에서 크기 차이**로 계급을 만든다. */
    .sum { padding: 16px; display: grid; gap: 14px; }

    .card {
      background: var(--surface); border: 1px solid var(--line);
      border-radius: 16px; padding: 16px;
    }

    /* 대문자 미세 라벨 — 값이 아니라 값의 이름이라는 표시 */
    .cap {
      font-size: 10px; font-weight: 650; letter-spacing: .1em;
      text-transform: uppercase; color: var(--faint);
      display: flex; align-items: center; gap: 6px;
    }
    .cap::before {
      content: ''; width: 6px; height: 6px; border-radius: 50%;
      background: var(--c, var(--accent)); flex: none;
    }
    .cap.plain::before { display: none; }

    /* 큰 숫자 + 칩 */
    .big { display: flex; align-items: center; gap: 9px; margin-top: 10px; }
    .big b { font-size: 32px; font-weight: 700; letter-spacing: -.03em; line-height: 1; }
    .big small { font-size: 15px; font-weight: 600; color: var(--faint); }
    .chip {
      font-size: 11px; font-weight: 650; padding: 3px 7px; border-radius: 7px;
      background: rgba(47,214,166,.14); color: var(--ok);
    }
    .chip.bad  { background: rgba(255,68,56,.14);  color: var(--danger); }
    .chip.warn { background: rgba(231,154,60,.16); color: var(--warn); }
    .chip.mute { background: var(--surface-2);     color: var(--muted); }

    /* 구성비 띠 — 숫자 넷을 나란히 적는 것보다 «비율» 이 먼저 읽힌다 */
    .seg { display: flex; gap: 3px; margin-top: 14px; }
    .seg i { height: 5px; border-radius: 3px; background: var(--c); flex: var(--f, 1); min-width: 6px; }
    .seg i.empty { background: var(--line); }

    /* 지표 넷 — 테두리 없이 여백으로 나눈다 */
    .cells { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 14px; }
    .cells > div { display: grid; gap: 7px; }
    .cells b { font-size: 20px; font-weight: 700; line-height: 1; letter-spacing: -.02em; }
    .cells b.bad { color: var(--danger); }
    .cells b.ok  { color: var(--ok); }
    .cells em { font-style: normal; font-size: 10.5px; color: var(--faint); }

    /* 면적 그래프 */
    .area { display: block; width: 100%; height: 62px; margin-top: 12px; }

    /* 가로 막대 — 답사 두께처럼 «많고 적음» 이 요점인 값 */
    .bars2 { display: grid; gap: 11px; margin-top: 14px; }
    .bars2 .row { display: grid; grid-template-columns: 1fr auto; gap: 4px 8px; font-size: 12px; }
    .bars2 .nm { color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .bars2 .vl { font-weight: 650; font-variant-numeric: tabular-nums; }
    .bars2 .tr { grid-column: 1/-1; height: 6px; border-radius: 4px; background: var(--surface-2); overflow: hidden; }
    .bars2 .tr i { display: block; height: 100%; border-radius: 4px; background: var(--ok); }
    .bars2 .row.thin .tr i { background: var(--warn); }
    .bars2 .row.thin .vl { color: var(--warn); }

    .steps { list-style: none; padding: 0; margin: 12px 0 0; display: grid; gap: 2px; }
    .steps li {
      display: grid; grid-template-columns: 20px 1fr; gap: 9px;
      padding: 9px 0; align-items: start;
    }
    .steps li + li { border-top: 1px solid var(--line); }
    .steps .no {
      font-size: 10.5px; font-weight: 700; color: var(--faint);
      font-variant-numeric: tabular-nums; padding-top: 2px;
    }
    .steps li b { font-size: 12.5px; font-weight: 600; }
    .steps li p { margin: 3px 0 0; font-size: 11.5px; color: var(--muted); line-height: 1.5; }
    .steps li.done .no { color: var(--ok); }
    .steps li.done b::after { content: ' ✓'; color: var(--ok); }
    .steps li.manual .no, .steps li.manual b { color: var(--accent); }
    .card .btn { width: 100%; justify-content: center; margin-top: 12px; }

    .none { color: var(--faint); font-size: 12px; margin-top: 10px; }
    .headline { display: grid; gap: 5px; padding: 0 2px; }
    .headline b { font-size: 21px; font-weight: 700; letter-spacing: -.02em; }
    .headline.alarm b { color: var(--danger); }
    .headline span { color: var(--faint); font-size: 11.5px; }

    .spark { display: block; width: 100%; height: 44px; }
    .none { color: var(--faint); font-size: 12px; padding: 3px 0; }

    /* ── 오른쪽 레일 (레이어 토글) ────────────────────────── */
    /* 레일도 같은 자를 쓴다 — 버튼 30px, 안여백 10px, 사이 5px.
       그래야 도구판과 위·아래 줄이 맞는다. */
    .ops-rail {
      top: 16px; right: 16px; width: 50px; padding: 10px;
      display: grid; gap: 5px; justify-items: center; height: max-content;
    }
    .ops-rail button svg, .ops-zoom button svg { width: 15px; height: 15px; display: block; }
    .ops-rail button {
      width: 30px; height: 30px; border-radius: 8px; cursor: pointer;
      border: 1px solid transparent; background: none; color: var(--muted);
      display: grid; place-items: center;
    }
    .ops-rail button:hover { background: var(--surface-2); color: var(--ink); }
    .ops-rail button[aria-pressed="true"] { background: var(--accent-soft); border-color: rgba(77,159,255,.35); color: var(--accent); }
    .ops-rail hr { border: 0; border-top: 1px solid var(--line); margin: 2px 0; width: 100%; }

    /* ── 바닥 (상태 · 확대) ───────────────────────────────── */
    .floor-tag {
      position: absolute; z-index: 3; top: 16px; left: 18px;
      display: flex; align-items: baseline; gap: 5px; pointer-events: none;
    }
    .floor-tag b { font-size: 30px; font-weight: 750; letter-spacing: -.03em; line-height: 1; }
    .floor-tag span { color: var(--faint); font-size: 12px; }

    .ops-status {
      left: 16px; top: 16px; height: 30px; display: flex; align-items: center;
      gap: 0; padding: 0 2px; font-size: 11px;
    }
    .ops-status .seg {
      display: flex; align-items: center; gap: 6px; padding: 0 10px; height: 100%;
      border-left: 1px solid var(--line); color: var(--muted); white-space: nowrap;
    }
    .ops-status .seg:first-child { border-left: 0; }
    .ops-status b { color: var(--ink); font-weight: 650; }
    .ops-status .seg.hot b { color: var(--danger); }
    .ops-status .seg.sos b { color: var(--warn); }

    .ops-zoom { right: 16px; bottom: 16px; width: 30px; padding: 2px; display: grid; gap: 2px; }
    .ops-zoom button {
      width: 26px; height: 26px; border-radius: 6px; cursor: pointer;
      border: 0; background: none; color: var(--muted); font-size: 14px;
    }
    .ops-zoom button:hover { background: var(--surface-2); color: var(--ink); }

    /* 범례는 왼쪽 아래에 세로로. 가로 알약으로 가운데 아래에 두었더니
       도면 아래쪽 지점들을 가렸다 — 지도가 판이 되면 아래쪽도 내용이다. */
    .legend {
      position: absolute; z-index: 3; bottom: 16px; left: 16px;
      display: grid; gap: 6px; font-size: 11px; color: var(--muted);
    }
    .legend span { display: flex; align-items: center; gap: 6px; }
    .legend i { width: 8px; height: 8px; border-radius: 50%; flex: none; }
    .legend i.route { width: 14px; height: 3px; border-radius: 2px; background: var(--route); }
    .legend i.fix { background: var(--route); }
    .legend i.pdr { background: var(--warn); }
    .legend i.sos { background: var(--danger); }
    .legend i.beacon { border-radius: 2px; transform: rotate(45deg); background: var(--beacon); }

    @media (max-width: 1140px) { .ops-body { grid-template-columns: minmax(0,1fr) 290px; } }
  </style>
</head>
<body class="adm">
  <svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
    <!-- 기호 문자(◇ ≋ ◯ ⋈ ◱ ⤢)를 아이콘으로 쓰고 있었다. 폰트마다 모양이
         달라지고 크기도 안 맞아서 «임시로 갖다 붙인 것» 처럼 보인다.
         선으로 직접 그린다 — 굵기와 크기를 한 곳에서 정할 수 있다. -->
    <g id="i-beacon" fill="none" stroke="currentColor" stroke-width="1.6"
       stroke-linecap="round" stroke-linejoin="round">
      <circle cx="8" cy="8" r="1.6"/><path d="M4.8 11.2a4.5 4.5 0 0 1 0-6.4"/>
      <path d="M11.2 4.8a4.5 4.5 0 0 1 0 6.4"/>
    </g>
    <g id="i-wave" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
      <path d="M2 9.5c1.2-2 2.4-2 3.6 0s2.4 2 3.6 0 2.4-2 3.6 0"/>
      <path d="M2 5.5c1.2-2 2.4-2 3.6 0s2.4 2 3.6 0 2.4-2 3.6 0" opacity=".45"/>
    </g>
    <g id="i-range" fill="none" stroke="currentColor" stroke-width="1.6">
      <circle cx="8" cy="8" r="5.5" stroke-dasharray="2.4 2.2"/><circle cx="8" cy="8" r="1.4" fill="currentColor" stroke="none"/>
    </g>
    <g id="i-graph" fill="none" stroke="currentColor" stroke-width="1.6"
       stroke-linecap="round" stroke-linejoin="round">
      <path d="M4 12l4-8 4 8"/><circle cx="4" cy="12" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="8" cy="4" r="1.5"/>
    </g>
    <g id="i-flat" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round">
      <path d="M2.5 6.5L8 3.5l5.5 3L8 9.5z"/><path d="M2.5 10L8 13l5.5-3" opacity=".45"/>
    </g>
    <g id="i-fit" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
      <path d="M6 3H3v3M10 3h3v3M6 13H3v-3M10 13h3v-3"/>
    </g>
    <g id="i-plus" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round">
      <path d="M8 4v8M4 8h8"/>
    </g>
    <g id="i-minus" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round">
      <path d="M4 8h8"/>
    </g>
    <g id="i-floor" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round">
      <path d="M2.5 8.5 8 5.5l5.5 3L8 11.5z"/>
      <path d="M5.2 7 10.8 10" opacity=".5"/><path d="M10.8 7 5.2 10" opacity=".5"/>
    </g>
    <g id="i-search" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
      <circle cx="7" cy="7" r="4.2"/><path d="M10.2 10.2L14 14"/>
    </g>
  </defs></svg>
  <div class="ops">
    <!-- ── 상단 ──────────────────────────────────────────── -->
    <header class="ops-bar">
      <div class="ops-brand">
        <!-- 표식은 그린다. ◈ 같은 기호 문자는 폰트에 따라 모양이 바뀌고,
             «아이콘 자리에 급히 넣은 글자» 로 보인다. -->
        <svg class="ops-mark" viewBox="0 0 20 20" aria-hidden="true">
          <path d="M10 2.5 17 6v8l-7 3.5L3 14V6z" fill="none" stroke="currentColor"
                stroke-width="1.5" stroke-linejoin="round"/>
          <circle cx="10" cy="10" r="2.2" fill="currentColor"/>
        </svg>
        <span class="ops-name">관제</span>
        <span class="ops-where" id="building-info">도면을 불러오는 중…</span>
      </div>

      <div class="ops-search">
        <svg width="13" height="13" viewBox="0 0 16 16"><use href="#i-search"/></svg>
        <input id="q" type="search" placeholder="사용자·지점·센서 검색" aria-label="검색" />
      </div>

      <div class="ops-actions">
        <!-- 상태는 **글자로** 적는다. 알약 두 개(층 / 저장소)가 버튼 두 개와
             나란히 있으니 무엇이 눌리는 것인지 알 수 없었다. 누를 수 있는
             것만 버튼 모양을 준다. -->
        <span class="ops-state">
          <b id="ctx-floor">—</b>
          <i aria-hidden="true"></i>
          <span id="mode-badge">연결 중…</span>
        </span>
        <a class="btn" href="architect.html">도면 편집기</a>
        <a class="btn" href="demo.html">통합 시연</a>
      </div>
    </header>

    <!-- ── 본문 ──────────────────────────────────────────── -->
    <div class="ops-body" data-view="iso">
      <!-- ── 왼쪽: 층 ─────────────────────────────────── -->
      <div class="ops-stage-col">
      <div class="stage-shadow" aria-hidden="true"></div>
      <div class="ops-canvas" id="canvas">
        <div class="stage" id="stage"><div class="stage-inner" id="stage-inner">
        <div class="slab" id="slab" aria-hidden="true">
          <i style="--d:1;--c:#2b3037"></i><i style="--d:2;--c:#282d34"></i>
          <i style="--d:3;--c:#252a30"></i><i style="--d:4;--c:#22262c"></i>
          <i style="--d:5;--c:#1f2328"></i><i style="--d:6;--c:#1b1f24"></i>
        </div>
        <div class="map-stack" id="map-stack">
          <svg id="admin-map" role="img" aria-label="층 지도"></svg>
          <svg id="corridor-layer" aria-hidden="true"></svg>
          <svg id="room-layer" aria-hidden="true"></svg>
          <svg id="route-layer" aria-hidden="true"></svg>
          <svg id="photo-scenario-layer" aria-hidden="true"></svg>
          <svg id="beacon-waves" aria-hidden="true"></svg>
          <svg id="live-layer" aria-hidden="true"></svg>
          <svg id="pick-layer" aria-label="사용자 선택"></svg>
        </div>
        <!-- 벽은 지도 **위에** 온다. 지도가 불투명해서 아래에 두면 통째로 가려진다. -->
        <div class="walls" id="walls" aria-hidden="true"></div>
        <div class="signs" id="signs" aria-hidden="true"></div>
        </div></div>
      </div>

      <!-- 도구 -->
      <section class="float ops-tools" aria-label="상황 주입">
        <span class="lbl">상황 주입 · <span id="map-mode">연기</span></span>
        <div class="toolgrid" role="group">
          <button class="tool" data-tool="fire"  aria-pressed="false">화재</button>
          <button class="tool" data-tool="smoke" aria-pressed="true">연기</button>
          <button class="tool" data-tool="crowd" aria-pressed="false">혼잡</button>
          <button class="tool" data-tool="temp"  aria-pressed="false">온도</button>
          <button class="tool" data-tool="clear" aria-pressed="false">해제</button>
          <button class="tool preset" id="btn-photo-scenario" aria-pressed="false">사진 시나리오 실행</button>
          <button class="tool ghost" id="btn-reset">시나리오 초기화</button>
        </div>

        <div id="temp-controls" class="radius-box" hidden>
          <label for="temp-value">주입할 온도 <b id="temp-readout">70°C</b></label>
          <input id="temp-value" type="range" min="15" max="120" step="5" value="70" />
          <p class="hint" id="temp-legend"></p>
          <p class="hint">통로·지점을 클릭하면 그 위치 온도로 전송됩니다.</p>
          <button class="tool ghost" id="btn-reset-sensors" style="margin-top:6px">온도 판독값 삭제</button>
        </div>

        <p class="hint" style="margin-top:10px">통로를 클릭하면 모든 앱이 경로를 다시 계산합니다.</p>
      </section>

      <!-- 레이어 -->
      <nav class="float ops-rail" aria-label="지도 레이어">
        <button id="show-beacons" role="switch" aria-pressed="true"  title="답사 지점" aria-label="답사 지점"><svg viewBox="0 0 16 16"><use href="#i-beacon"/></svg></button>
        <button id="show-waves"   role="switch" aria-pressed="true"  title="전파" aria-label="전파"><svg viewBox="0 0 16 16"><use href="#i-wave"/></svg></button>
        <button id="show-range"   role="switch" aria-pressed="false" title="도달 범위" aria-label="도달 범위"><svg viewBox="0 0 16 16"><use href="#i-range"/></svg></button>
        <button id="show-graph"   role="switch" aria-pressed="false" title="통로 그래프" aria-label="통로 그래프"><svg viewBox="0 0 16 16"><use href="#i-graph"/></svg></button>
        <button id="show-corridor" role="switch" aria-pressed="false" title="복도로 인식한 곳" aria-label="복도로 인식한 곳"><svg viewBox="0 0 16 16"><use href="#i-floor"/></svg></button>
        <hr />
        <button id="btn-view" role="switch" aria-pressed="true" title="평면 ↔ 입체" aria-label="평면 또는 입체"><svg viewBox="0 0 16 16"><use href="#i-flat"/></svg></button>
        <button id="btn-fit" title="시점 초기화" aria-label="시점 초기화"><svg viewBox="0 0 16 16"><use href="#i-fit"/></svg></button>
      </nav>

      <!-- 층 이름만 크게. 숫자 넷은 오른쪽 패널이 이미 크게 적고 있어서,
           같은 값을 두 곳에 두면 어느 쪽을 봐야 하는지 헷갈린다.
           지도 위에 필요한 것은 «지금 몇 층을 보고 있나» 뿐이다. -->
      <div class="floor-tag">
        <b id="stat-floor">—</b>
        <span>층</span>
      </div>
      <span hidden id="stat-people">0</span>
      <span hidden id="stat-hazards">0</span>
      <span hidden id="stat-sos">0</span>

      <div class="legend">
        <span><i class="route"></i>대피 경로</span>
        <!-- 「비콘 확정」과 「비콘」이 이름은 같은데 색이 달라 헷갈렸다.
             둘은 축이 다르다 — 앞은 **사람**이 어떻게 잡혔나, 뒤는 **자리**다.
             색은 그대로 두고 이름으로 가른다. -->
        <span><i class="fix"></i>전파로 잡힌 사람</span>
        <span><i class="pdr"></i>걸음으로 추정한 사람</span>
        <span><i class="sos"></i>구조 필요</span>
        <span><i class="beacon"></i>답사 지점</span>
        <span id="beacon-note" hidden style="color:var(--faint)">비콘 없음 — 답사 전</span>
      </div>

      <div class="float ops-zoom">
        <button id="zoom-in"  title="확대" aria-label="확대"><svg viewBox="0 0 16 16"><use href="#i-plus"/></svg></button>
        <button id="zoom-out" title="축소" aria-label="축소"><svg viewBox="0 0 16 16"><use href="#i-minus"/></svg></button>
      </div>
      </div><!-- /왼쪽 -->

      <!-- ── 오른쪽: 지금 벌어지는 일 ─────────────────── -->
      <aside class="ops-side">
      <!-- 선택한 대피자 -->
      <aside class="ops-panel" id="detail" aria-live="polite">
        <div id="detail-empty"><div class="sum" id="summary"></div></div>
        <div id="detail-body" hidden style="display:contents"></div>
      </aside>
      <!-- 감시 목록 -->
      <section class="ops-drawer" id="drawer" data-open="true" aria-label="감시 목록">
        <div class="drawer-tabs" role="tablist">
          <button role="tab" aria-selected="true"  data-pane="pane-people"><b id="n-people">0</b>대피</button>
          <button role="tab" aria-selected="false" data-pane="pane-sos"><b id="n-sos">0</b>구조</button>
          <button role="tab" aria-selected="false" data-pane="pane-sensors"><b id="n-sensors">0</b>센서</button>
          <button role="tab" aria-selected="false" data-pane="pane-metrics"><b id="stat-recalc">–</b>재탐색</button>
        </div>
        <div class="drawer-body">
          <div class="drawer-pane" id="pane-people"><ul id="pos-list" class="list"><li class="empty">아직 없음</li></ul></div>
          <div class="drawer-pane" id="pane-sos" hidden><ul id="sos-list" class="list"><li class="empty">아직 없음</li></ul></div>
          <div class="drawer-pane" id="pane-sensors" hidden><ul id="sensor-list" class="list"><li class="empty">판독값 없음</li></ul></div>
          <div class="drawer-pane" id="pane-metrics" hidden><ul id="metric-list" class="list"><li class="empty">아직 없음</li></ul></div>
        </div>
      </section>
      </aside>
    </div>
  </div>

  <script type="module" src="js/admin.js"></script>
</body>
</html>
