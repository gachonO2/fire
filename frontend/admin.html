<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>관제 — 실내 대피 안내</title>
  <link rel="stylesheet" href="css/style.css" />
  <style>
    /* ─────────────────────────────────────────────────────────────
       폰 앱(fireapp/src/theme.js)과 같은 토큰을 쓴다.
       시연에서 폰 화면과 관제를 나란히 놓으므로 색이 어긋나면 딴 제품처럼 보인다.
       ───────────────────────────────────────────────────────────── */
    .adm {
      --bg: #0b0f14;
      --surface: #151b23;
      --surface-2: #1b2431;
      --line: rgba(255,255,255,.09);
      --line-2: rgba(255,255,255,.16);
      --text: #f3f4f6;
      --dim: #9ca3af;
      --accent: #2563eb;
      --ok: #22c55e;
      --warn: #f59e0b;
      --danger: #ef4444;
      --beacon: #8b5cf6;
      --r: 16px;
    }

    body { background: var(--bg); color: var(--text); }

    /* ── 상단 ─────────────────────────────────────────── */
    .adm-top {
      display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
      padding: 14px 20px; border-bottom: 1px solid var(--line);
      background: rgba(11,15,20,.92); position: sticky; top: 0; z-index: 5;
      backdrop-filter: blur(8px);
    }
    .adm-title { font-size: 17px; font-weight: 800; letter-spacing: -.01em; }
    .adm-where { font-size: 13px; color: var(--dim); }
    .adm-top nav { margin-left: auto; display: flex; align-items: center; gap: 8px; }
    .adm-top nav a {
      font-size: 13px; color: var(--dim); text-decoration: none;
      padding: 7px 12px; border-radius: 999px; border: 1px solid var(--line);
    }
    .adm-top nav a:hover { color: var(--text); border-color: var(--line-2); }

    .pill {
      display: inline-flex; align-items: center; gap: 7px;
      font-size: 12.5px; font-weight: 600; padding: 7px 13px; border-radius: 999px;
      background: var(--surface); border: 1px solid var(--line);
    }
    .pill::before {
      content: ''; width: 7px; height: 7px; border-radius: 50%;
      background: var(--ok); box-shadow: 0 0 0 3px rgba(34,197,94,.2);
    }
    .pill.off::before { background: var(--danger); box-shadow: 0 0 0 3px rgba(239,68,68,.2); }

    /* ── 레이아웃 ─────────────────────────────────────── */
    .adm-grid {
      display: grid; grid-template-columns: 1fr; gap: 16px; padding: 16px 20px 32px;
      max-width: 1560px; margin: 0 auto; align-items: start;
    }
    @media (min-width: 1080px) { .adm-grid { grid-template-columns: minmax(0,1fr) 350px; } }

    .card {
      background: var(--surface); border: 1px solid var(--line);
      border-radius: var(--r); padding: 16px 18px;
    }
    .card + .card { margin-top: 14px; }
    .card > h2 {
      font-size: 13px; font-weight: 700; letter-spacing: .02em;
      color: var(--dim); margin: 0 0 12px; text-transform: none;
      display: flex; align-items: center; gap: 8px;
    }
    .card > h2 .n {
      font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 999px;
      background: var(--surface-2); color: var(--text);
    }

    /* ── 상황 요약 (시연 때 제일 먼저 보이는 줄) ─────────── */
    .status-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 14px; }
    @media (max-width: 720px) { .status-row { grid-template-columns: repeat(2, 1fr); } }
    .stat {
      background: var(--surface); border: 1px solid var(--line);
      border-radius: 14px; padding: 13px 15px;
    }
    .stat b { display: block; font-size: 25px; font-weight: 800; line-height: 1.15; font-variant-numeric: tabular-nums; }
    .stat span { font-size: 12px; color: var(--dim); }
    .stat.hot { border-color: rgba(239,68,68,.5); background: rgba(239,68,68,.09); }
    .stat.hot b { color: var(--danger); }
    .stat.live b { color: var(--accent); }
    .stat.sos { border-color: rgba(245,158,11,.5); background: rgba(245,158,11,.09); }
    .stat.sos b { color: var(--warn); }

    /* ── 도구 ─────────────────────────────────────────── */
    .tools { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
    .tool {
      font-size: 13.5px; font-weight: 600; padding: 9px 15px; border-radius: 999px;
      background: var(--surface-2); color: var(--text);
      border: 1px solid var(--line); cursor: pointer;
    }
    .tool:hover { border-color: var(--line-2); }
    .tool[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }
    .tool.ghost { background: transparent; color: var(--dim); }

    .radius-box { background: var(--surface-2); border-radius: 12px; padding: 12px 14px; margin-bottom: 12px; }
    .radius-box label { font-size: 12.5px; color: var(--dim); }
    .radius-box b { color: var(--text); font-size: 15px; }
    .radius-box input[type=range] { width: 100%; margin-top: 6px; accent-color: var(--danger); }

    /* ── 지도 ─────────────────────────────────────────── */
    .map-stack { position: relative; border-radius: 12px; overflow: hidden; background: var(--bg); }
    .map-stack svg { display: block; width: 100%; height: auto; }
    .map-stack #live-layer, .map-stack #beacon-waves {
      position: absolute; inset: 0; pointer-events: none;
    }

    .legend { display: flex; flex-wrap: wrap; gap: 7px 16px; margin-top: 11px; font-size: 12.5px; color: var(--dim); }
    .legend span { display: flex; align-items: center; gap: 6px; }
    .legend i { width: 11px; height: 11px; border-radius: 50%; flex: none; }
    .legend i.beacon { border-radius: 2px; transform: rotate(45deg); background: var(--beacon); }
    .legend i.fix { background: #0090ff; }
    .legend i.pdr { background: #ff9500; }
    .legend i.sos { background: var(--danger); }

    .map-toggles { display: flex; flex-wrap: wrap; gap: 6px 14px; margin-top: 10px; font-size: 12.5px; color: var(--dim); }
    .map-toggles label { display: flex; align-items: center; gap: 6px; cursor: pointer; }

    /* ── 목록 ─────────────────────────────────────────── */
    .list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 7px; }
    .list li {
      background: var(--surface-2); border-radius: 11px; padding: 10px 12px; font-size: 13.5px;
      border-left: 3px solid transparent;
    }
    .list li.empty { background: none; color: var(--dim); font-size: 12.5px; padding: 4px 2px; border: 0; }
    .list .time { font-size: 11.5px; color: var(--dim); margin-top: 3px; }
    .list li strong { font-weight: 700; }

    .hint { font-size: 12.5px; color: var(--dim); line-height: 1.55; margin: 0; }
    .hint + .hint { margin-top: 6px; }
  </style>
</head>
<body class="adm">
  <header class="adm-top">
    <div>
      <div class="adm-title">관제</div>
      <div class="adm-where" id="building-info">도면을 불러오는 중…</div>
    </div>
    <nav>
      <a href="architect.html">도면 편집기</a>
      <a href="demo.html">통합 시연</a>
      <span id="mode-badge" class="pill">연결 중…</span>
    </nav>
  </header>

  <div class="adm-grid">
    <div>
      <!-- 시연에서 제일 먼저 눈이 가는 줄. 숫자 네 개로 상황이 읽혀야 한다 -->
      <div class="status-row">
        <div class="stat live"><b id="stat-people">0</b><span>대피 중</span></div>
        <div class="stat hot"><b id="stat-hazards">0</b><span>막힌 통로</span></div>
        <div class="stat sos"><b id="stat-sos">0</b><span>구조 요청</span></div>
        <div class="stat"><b id="stat-recalc">–</b><span>최근 재탐색</span></div>
      </div>

      <section class="card">
        <h2>층 지도 <span class="n" id="map-mode">연기</span></h2>

        <div class="tools" role="group" aria-label="적용할 도구">
          <button class="tool" data-tool="fire" aria-pressed="false">화재</button>
          <button class="tool" data-tool="smoke" aria-pressed="true">연기</button>
          <button class="tool" data-tool="crowd" aria-pressed="false">혼잡</button>
          <button class="tool" data-tool="temp" aria-pressed="false">온도</button>
          <button class="tool" data-tool="clear" aria-pressed="false">해제</button>
          <button class="tool ghost" id="btn-reset">시나리오 초기화</button>
        </div>

        <div id="temp-controls" class="radius-box" hidden>
          <label for="temp-value">주입할 온도 <b id="temp-readout">70°C</b></label>
          <input id="temp-value" type="range" min="15" max="120" step="5" value="70" />
          <p class="hint" id="temp-legend"></p>
          <p class="hint">통로 또는 지점을 클릭하면 그 위치의 온도로 전송됩니다. 지점이 과열되면 연결된 통로가 전부 막힙니다.</p>
          <button class="tool ghost" id="btn-reset-sensors" style="margin-top:8px">온도 판독값 삭제</button>
        </div>

        <div class="map-stack">
          <svg id="admin-map" role="img" aria-label="층 지도"></svg>
          <svg id="beacon-waves" aria-hidden="true"></svg>
          <svg id="live-layer" aria-hidden="true"></svg>
        </div>

        <div class="legend">
          <span><i class="fix"></i> 비콘이 확정한 위치</span>
          <span><i class="pdr"></i> 걸음 수로 추정 중</span>
          <span><i class="sos"></i> 구조 필요</span>
          <span><i class="beacon"></i> 비콘</span>
        </div>
        <div class="map-toggles">
          <label><input id="show-beacons" type="checkbox" checked /> 비콘 표시</label>
          <label><input id="show-waves" type="checkbox" checked /> 전파</label>
          <label><input id="show-range" type="checkbox" /> 도달 범위 (지점 선택 시)</label>
        </div>
        <p class="hint" style="margin-top:10px">통로를 클릭하면 모든 사용자 앱이 즉시 경로를 다시 계산합니다.</p>
      </section>
    </div>

    <div>
      <section class="card">
        <h2>대피 중인 사용자 <span class="n" id="n-people">0</span></h2>
        <ul id="pos-list" class="list"><li class="empty">아직 없음</li></ul>
      </section>

      <section class="card">
        <h2>구조 요청 <span class="n" id="n-sos">0</span></h2>
        <ul id="sos-list" class="list"><li class="empty">아직 없음</li></ul>
      </section>

      <section class="card">
        <h2>온도 센서 <span class="n" id="n-sensors">0</span></h2>
        <ul id="sensor-list" class="list"><li class="empty">판독값 없음</li></ul>
      </section>

      <section class="card">
        <h2>경로 재탐색 시간</h2>
        <ul id="metric-list" class="list"><li class="empty">아직 없음</li></ul>
      </section>
    </div>
  </div>

  <script type="module" src="js/admin.js"></script>
</body>
</html>
