<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900" width="1400" height="900">
  <!--
    가천관 3층 샘플 도면 (2.5D)
    벽에 두께와 그림자를 넣어 입체로 보이게 하되, 바닥은 정사영(위에서 내려다본 상태)을 유지한다.
    아이소메트릭으로 기울이면 방향에 따라 거리가 최대 1.7배까지 왜곡되어
    "몇 걸음"을 계산할 수 없기 때문이다. 좌표 1px = 0.03m.
  -->
  <defs>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f4f1ea"/>
      <stop offset="100%" stop-color="#ddd8ce"/>
    </linearGradient>
    <linearGradient id="corridor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#cfe3f0"/>
      <stop offset="100%" stop-color="#b9d4e6"/>
    </linearGradient>
    <linearGradient id="room" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#eae5db"/>
    </linearGradient>
    <linearGradient id="wallFace" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8b8f96"/>
      <stop offset="55%" stop-color="#5f646c"/>
      <stop offset="100%" stop-color="#464b53"/>
    </linearGradient>
    <!-- 벽 높이를 암시하는 그림자 -->
    <filter id="extrude" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="6" dy="9" stdDeviation="4" flood-color="#0b0d12" flood-opacity="0.42"/>
    </filter>
    <filter id="slab" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="10" dy="16" stdDeviation="10" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- 바닥 슬래브 (두께감) -->
  <g filter="url(#slab)">
    <rect x="60" y="100" width="1280" height="740" rx="8" fill="url(#floor)"/>
  </g>

  <!-- 복도 (통행 구역) -->
  <g>
    <rect x="76" y="240" width="1248" height="80" fill="url(#corridor)"/>
    <rect x="640" y="320" width="120" height="280" fill="url(#corridor)"/>
    <rect x="76" y="600" width="1248" height="80" fill="url(#corridor)"/>
  </g>

  <!-- 실 바닥 -->
  <g fill="url(#room)">
    <rect x="240" y="110" width="180" height="130"/>
    <rect x="440" y="110" width="620" height="130"/>
    <rect x="1080" y="110" width="180" height="130"/>
    <rect x="120" y="320" width="520" height="280"/>
    <rect x="760" y="320" width="520" height="280"/>
    <rect x="200" y="680" width="280" height="150"/>
    <rect x="500" y="680" width="280" height="150"/>
    <rect x="800" y="680" width="320" height="150"/>
  </g>

  <!-- 계단 표현 -->
  <g stroke="#9aa0a8" stroke-width="3">
    <path d="M255 130 h150 M255 148 h150 M255 166 h150 M255 184 h150 M255 202 h150 M255 220 h150"/>
    <path d="M1095 130 h150 M1095 148 h150 M1095 166 h150 M1095 184 h150 M1095 202 h150 M1095 220 h150"/>
  </g>
  <g fill="none" stroke="#6f757d" stroke-width="4">
    <path d="M330 126 v100 M1170 126 v100"/>
  </g>

  <!-- 벽 (두께 + 그림자로 입체감) -->
  <g filter="url(#extrude)" fill="url(#wallFace)">
    <!-- 외벽 -->
    <rect x="60" y="100" width="1280" height="16"/>
    <rect x="60" y="824" width="1280" height="16"/>
    <rect x="60" y="100" width="16" height="740"/>
    <rect x="1324" y="100" width="16" height="740"/>

    <!-- 상단 실 -->
    <rect x="240" y="110" width="14" height="130"/>
    <rect x="406" y="110" width="14" height="130"/>
    <rect x="240" y="233" width="180" height="14"/>
    <rect x="440" y="110" width="14" height="130"/>
    <rect x="1046" y="110" width="14" height="130"/>
    <rect x="440" y="233" width="620" height="14"/>
    <rect x="1080" y="110" width="14" height="130"/>
    <rect x="1246" y="110" width="14" height="130"/>
    <rect x="1080" y="233" width="180" height="14"/>

    <!-- 중간 실 -->
    <rect x="120" y="313" width="520" height="14"/>
    <rect x="626" y="313" width="14" height="287"/>
    <rect x="120" y="593" width="520" height="14"/>
    <rect x="760" y="313" width="520" height="14"/>
    <rect x="760" y="313" width="14" height="287"/>
    <rect x="760" y="593" width="520" height="14"/>

    <!-- 하단 실 -->
    <rect x="200" y="673" width="280" height="14"/>
    <rect x="200" y="673" width="14" height="157"/>
    <rect x="466" y="673" width="14" height="157"/>
    <rect x="500" y="673" width="280" height="14"/>
    <rect x="500" y="673" width="14" height="157"/>
    <rect x="766" y="673" width="14" height="157"/>
    <rect x="800" y="673" width="320" height="14"/>
    <rect x="800" y="673" width="14" height="157"/>
    <rect x="1106" y="673" width="14" height="157"/>
  </g>

  <!-- 출입구 (벽을 뚫은 자리) -->
  <g fill="url(#corridor)">
    <rect x="310" y="231" width="42" height="18"/>
    <rect x="720" y="231" width="42" height="18"/>
    <rect x="1150" y="231" width="42" height="18"/>
    <rect x="560" y="311" width="42" height="18"/>
    <rect x="800" y="311" width="42" height="18"/>
    <rect x="320" y="671" width="42" height="18"/>
    <rect x="620" y="671" width="42" height="18"/>
    <rect x="900" y="671" width="42" height="18"/>
  </g>
  <g fill="none" stroke="#7c828a" stroke-width="2.5">
    <path d="M310 240 a42 42 0 0 0 42 -42"/>
    <path d="M720 240 a42 42 0 0 0 42 -42"/>
    <path d="M1150 240 a42 42 0 0 0 42 -42"/>
    <path d="M560 320 a42 42 0 0 1 42 42"/>
    <path d="M800 320 a42 42 0 0 1 42 42"/>
    <path d="M320 680 a42 42 0 0 1 42 42"/>
    <path d="M620 680 a42 42 0 0 1 42 42"/>
    <path d="M900 680 a42 42 0 0 1 42 42"/>
  </g>

  <!-- 실 이름 -->
  <g font-family="'Noto Sans KR',sans-serif" font-size="22" fill="#3a3f47" text-anchor="middle">
    <text x="330" y="182">서편 비상계단</text>
    <text x="750" y="182">교학 사무실</text>
    <text x="1170" y="182">동편 비상계단</text>
    <text x="380" y="465">311호 강의실</text>
    <text x="1020" y="465">컴퓨터 실습실</text>
    <text x="340" y="765">312호 강의실</text>
    <text x="640" y="765">313호 강의실</text>
    <text x="960" y="765">휴게 라운지</text>
  </g>
  <g font-family="'Noto Sans KR',sans-serif" font-size="19" fill="#4a6b82" text-anchor="middle">
    <text x="700" y="292">북 측 복 도</text>
    <text x="700" y="648">남 측 복 도</text>
  </g>

  <!-- 방위·축척 -->
  <g transform="translate(1250,780)">
    <circle r="34" fill="#ffffff" opacity="0.85"/>
    <path d="M0 -26 L9 6 L0 0 L-9 6 Z" fill="#e5484d"/>
    <text y="24" font-family="sans-serif" font-size="16" fill="#3a3f47" text-anchor="middle">N</text>
  </g>
  <g transform="translate(110,865)" font-family="sans-serif" font-size="15" fill="#3a3f47">
    <rect x="0" y="-9" width="167" height="7" fill="#3a3f47"/>
    <rect x="0" y="-9" width="83" height="7" fill="#ffffff" stroke="#3a3f47" stroke-width="1"/>
    <text x="175" y="0">5m</text>
  </g>
  <text x="70" y="884" font-family="'Noto Sans KR',sans-serif" font-size="14" fill="#6b7280">
    가천관 3층 · 샘플 도면 (실측 도면 아님)
  </text>
</svg>
